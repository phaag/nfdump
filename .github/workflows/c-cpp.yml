name: C CI

on:
  push:
    branches:
      - master
      - devel_1.8.x

  pull_request:
    branches:
      - master
      - devel_1.8.x

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURE_FLAGS: "--enable-nfpcapd --enable-ja4"

jobs:

  #
  # ----------------------------------------------------------------------
  # Native Linux / macOS builds
  # ----------------------------------------------------------------------
  #
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: Ubuntu x86_64 / GCC
            os: ubuntu-24.04
            cc: gcc

          - name: Ubuntu x86_64 / Clang
            os: ubuntu-24.04
            cc: clang

          - name: Ubuntu ARM64 / GCC
            os: ubuntu-24.04-arm
            cc: gcc

          - name: macOS ARM64 / Clang
            os: macos-15
            cc: clang

          - name: macOS x86_64 / Clang
            os: macos-15-intel
            cc: clang

    env:
      CC: ${{ matrix.cc }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      #
      # Linux dependencies
      #
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            clang \
            autoconf \
            automake \
            libtool \
            pkg-config \
            flex \
            bison \
            libpcap-dev \
            liblz4-dev \
            libzstd-dev \
            libbz2-dev \
            zlib1g-dev \
            libpcre2-dev \
            libsodium-dev

      #
      # macOS dependencies
      #
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            flex \
            bison \
            lz4 \
            zstd \
            pcre2 \
            libsodium

          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Show build environment
        run: |
          uname -a
          echo "CC=$CC"
          "$CC" --version
          autoconf --version | head -1
          automake --version | head -1

      - name: Bootstrap
        run: sh bootstrap

      - name: Configure
        run: ./configure $CONFIGURE_FLAGS

      - name: Build
        run: make -j2

      - name: Run tests
        run: make check VERBOSE=1


  #
  # ----------------------------------------------------------------------
  # Debian reference build
  # ----------------------------------------------------------------------
  #
  debian:
    name: Debian 13 / GCC
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: debian:13

    env:
      CC: gcc

    steps:

      #
      # Install git before checkout, because the job itself runs
      # inside the Debian container.
      #
      - name: Install build environment
        run: |
          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            git \
            gcc \
            make \
            autoconf \
            automake \
            libtool \
            pkg-config \
            flex \
            bison \
            libpcap-dev \
            liblz4-dev \
            libzstd-dev \
            libbz2-dev \
            zlib1g-dev \
            libpcre2-dev \
            libsodium-dev

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show build environment
        run: |
          cat /etc/debian_version
          uname -a
          gcc --version
          autoconf --version | head -1
          automake --version | head -1

      - name: Bootstrap
        run: sh bootstrap

      - name: Configure
        run: ./configure $CONFIGURE_FLAGS

      - name: Build
        run: make -j2

      - name: Run tests
        run: make check VERBOSE=1
