name: C CI

on:
    push:
        branches:
            - master
            - devel_1.8.x

    pull_request:
        branches:
            - master
            - devel_1.8.x

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CONFIGURE_FLAGS: "--enable-nfpcapd --enable-ja4 --enable-readpcap"

jobs:
    #
    # ----------------------------------------------------------------------
    # Native Linux / macOS builds
    # ----------------------------------------------------------------------
    #
    native:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30

        strategy:
            fail-fast: false

            matrix:
                include:
                    - name: Ubuntu x86_64 / GCC
                      slug: ubuntu-x64-gcc
                      os: ubuntu-24.04
                      cc: gcc
                      flags: "--enable-nfpcapd --enable-ja4 --enable-readpcap"

                    - name: Ubuntu x86_64 / Clang
                      slug: ubuntu-x64-clang
                      os: ubuntu-24.04
                      cc: clang
                      flags: "--enable-nfpcapd --enable-ja4 --enable-readpcap"

                    - name: Ubuntu ARM64 / GCC
                      slug: ubuntu-arm64-gcc
                      os: ubuntu-24.04-arm
                      cc: gcc
                      flags: "--enable-nfpcapd --enable-ja4 --enable-readpcap"

                    #
                    # Plain ./configure, no optional features at all. This is the
                    # exact configuration that previously broke the build
                    # (nfcapd.c: undeclared 'pcap_device') without CI ever noticing,
                    # because every other leg always enables nfpcapd/readpcap.
                    #
                    - name: Ubuntu x86_64 / GCC / minimal (no optional features)
                      slug: ubuntu-x64-gcc-minimal
                      os: ubuntu-24.04
                      cc: gcc
                      flags: ""

                    - name: macOS ARM64 / Clang
                      slug: macos-arm64-clang
                      os: macos-15
                      cc: clang
                      flags: "--enable-nfpcapd --enable-ja4 --enable-readpcap"

                    - name: macOS x86_64 / Clang
                      slug: macos-x64-clang
                      os: macos-15-intel
                      cc: clang
                      flags: "--enable-nfpcapd --enable-ja4 --enable-readpcap"

        env:
            CC: ${{ matrix.cc }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            #
            # Linux dependencies
            #
            - name: Install dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    gcc \
                    clang \
                    autoconf \
                    automake \
                    libtool \
                    pkg-config \
                    flex \
                    bison \
                    libpcap-dev \
                    liblz4-dev \
                    libzstd-dev \
                    libbz2-dev \
                    zlib1g-dev \
                    libpcre2-dev \
                    libsodium-dev

            #
            # macOS dependencies
            #
            - name: Install dependencies (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew install \
                    autoconf \
                    automake \
                    libtool \
                    pkg-config \
                    flex \
                    bison \
                    lz4 \
                    zstd \
                    pcre2 \
                    libsodium

                  echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
                  echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

            - name: Show build environment
              run: |
                  uname -a
                  echo "CC=$CC"
                  "$CC" --version
                  autoconf --version | head -1
                  automake --version | head -1

            - name: Bootstrap
              run: sh bootstrap

            - name: Configure
              run: ./configure ${{ matrix.flags }}

            - name: Build
              run: |
                  if [ "${{ runner.os }}" = "macOS" ]; then
                    make -j"$(sysctl -n hw.ncpu)"
                  else
                    make -j"$(nproc)"
                  fi

            - name: Run tests
              run: make check VERBOSE=1

            - name: Upload test logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-logs-${{ matrix.slug }}
                  path: |
                      src/test/*.log
                      src/test/*.trs
                      config.log
                  retention-days: 7

    #
    # ----------------------------------------------------------------------
    # Debian reference build
    # ----------------------------------------------------------------------
    #
    debian:
        name: Debian 13 / GCC
        runs-on: ubuntu-latest
        timeout-minutes: 30

        container:
            image: debian:13

        env:
            CC: gcc

        steps:
            #
            # Install git before checkout, because the job itself runs
            # inside the Debian container.
            #
            - name: Install build environment
              run: |
                  apt-get update

                  DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    ca-certificates \
                    git \
                    gcc \
                    make \
                    autoconf \
                    automake \
                    libtool \
                    pkg-config \
                    flex \
                    bison \
                    libpcap-dev \
                    liblz4-dev \
                    libzstd-dev \
                    libbz2-dev \
                    zlib1g-dev \
                    libpcre2-dev \
                    libsodium-dev

            - name: Configure Git safe directory
              run: git config --global --add safe.directory '*'

            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Show build environment
              run: |
                  cat /etc/debian_version
                  uname -a
                  gcc --version
                  autoconf --version | head -1
                  automake --version | head -1

            - name: Bootstrap
              run: sh bootstrap

            - name: Configure
              run: ./configure $CONFIGURE_FLAGS

            - name: Build
              run: make -j"$(nproc)"

            - name: Run tests
              run: make check VERBOSE=1

            - name: Upload test logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-logs-debian13-gcc
                  path: |
                      src/test/*.log
                      src/test/*.trs
                      config.log
                  retention-days: 7

    #
    # ----------------------------------------------------------------------
    # musl libc (Alpine)
    #
    # Cheap (container, no VM) coverage for non-glibc portability bugs:
    # strict header exposure, no GNU extensions, different libc internals.
    # ----------------------------------------------------------------------
    #
    musl:
        name: Alpine / musl / GCC
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        container:
            image: alpine:latest

        env:
            CC: gcc

        steps:
            - name: Install build environment
              run: |
                  apk add --no-cache \
                    build-base \
                    git \
                    tzdata \
                    autoconf \
                    automake \
                    libtool \
                    pkgconf \
                    flex \
                    bison \
                    linux-headers \
                    libpcap-dev \
                    lz4-dev \
                    zstd-dev \
                    bzip2-dev \
                    zlib-dev \
                    pcre2-dev \
                    libsodium-dev \
                    libbsd-dev

            - name: Configure Git safe directory
              run: git config --global --add safe.directory '*'

            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Show build environment
              run: |
                  uname -a
                  gcc --version
                  autoconf --version | head -1
                  automake --version | head -1

            - name: Bootstrap
              run: sh bootstrap

            - name: Configure
              run: ./configure $CONFIGURE_FLAGS

            - name: Build
              run: make -j"$(nproc)"

            - name: Run tests
              run: make check VERBOSE=1

            - name: Upload test logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-logs-alpine-musl-gcc
                  path: |
                      src/test/*.log
                      src/test/*.trs
                      config.log
                  retention-days: 7
