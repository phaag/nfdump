name: Static Analysis

on:
    push:
        branches:
            - master
            - devel_1.8.x

    pull_request:
        branches:
            - master
            - devel_1.8.x

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    #
    # ----------------------------------------------------------------------
    # cppcheck
    #
    # Informational for now (continue-on-error): the codebase has not been
    # triaged to a clean baseline against this exact ruleset yet. Drop
    # continue-on-error once a suppression list / clean run is established.
    # ----------------------------------------------------------------------
    #
    cppcheck:
        name: cppcheck
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        continue-on-error: true

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install analysis and build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    autoconf \
                    automake \
                    bear \
                    bison \
                    cppcheck \
                    flex \
                    libbz2-dev \
                    liblz4-dev \
                    libpcre2-dev \
                    libpcap-dev \
                    libsodium-dev \
                    libtool \
                    libzstd-dev \
                    pkg-config \
                    zlib1g-dev

            - name: Configure project
              run: |
                  sh bootstrap
                  ./configure --enable-nfpcapd --enable-ja4 --enable-readpcap

            - name: Build compilation database
              run: bear --output compile_commands.json -- make -j"$(nproc)"

            - name: Show version
              run: cppcheck --version

            - name: Run cppcheck
              run: |
                  set +e
                  cppcheck \
                    --project=compile_commands.json \
                    --enable=warning,performance,portability \
                    --inline-suppr \
                    --suppress=missingIncludeSystem \
                    --error-exitcode=1 \
                    --output-file=cppcheck-report.txt
                  status=$?
                  cat cppcheck-report.txt
                  exit "$status"

            - name: Upload cppcheck report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: cppcheck-report
                  path: cppcheck-report.txt
                  if-no-files-found: error
                  retention-days: 7
